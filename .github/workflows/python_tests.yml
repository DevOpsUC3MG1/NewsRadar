name: NewsRadar QA Automation
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: newsradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: adminpassword
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio nest-asyncio fastapi starlette httpx requests responses python-dotenv sqlalchemy asyncpg motor pymongo openai feedparser apscheduler pydantic[email] uvicorn python-multipart email-validator
    - name: Run tests with coverage
      env:
        ENV: testing
        DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/newsradar_test
        MONGODB_URL: mongodb://admin:adminpassword@localhost:27017
      run: |
        python -m pytest --cov=backend/newsradar_api --cov-report=term --cov-fail-under=50 backend/tests/