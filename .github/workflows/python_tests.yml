name: NewsRadar QA Automation
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: newsradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov fastapi starlette httpx requests responses python-dotenv sqlalchemy asyncpg motor pymongo openai feedparser apscheduler pydantic[email] uvicorn python-multipart email-validator
    - name: Run tests with coverage
      env:
        ENV: testing
        DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/newsradar_test
      run: |
        python -m pytest --cov=backend --cov-report=term backend/tests/