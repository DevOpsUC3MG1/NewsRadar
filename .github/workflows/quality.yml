name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: newsradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov fastapi starlette httpx responses python-dotenv sqlalchemy asyncpg pydantic[email] uvicorn python-multipart email-validator

      - name: Lint
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=backend/migrations

      - name: Coverage
        env:
          ENV: testing
          DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/newsradar_test
        run: pytest --cov=backend backend/tests/