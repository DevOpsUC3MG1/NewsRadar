name: CI Complete Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: newsradar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: adminpassword
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    # -------------------------
    # Checkout
    # -------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # -------------------------
    # Setup Python
    # -------------------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # -------------------------
    # Install dependencies
    # -------------------------
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio flake8 nest-asyncio fastapi starlette httpx requests responses python-dotenv sqlalchemy asyncpg motor pymongo openai feedparser apscheduler pydantic[email] uvicorn python-multipart email-validator

    # -------------------------
    # LINT (flake8 + Ruff)
    # -------------------------
    - name: Lint code (flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=backend/migrations

    - name: Lint code (Ruff)
      run: |
        pip install ruff
        ruff check .

    # -------------------------
    # TESTS + COVERAGE
    # -------------------------
    - name: Run tests with coverage
      env:
        ENV: testing
        DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/newsradar_test
        MONGODB_URL: mongodb://admin:adminpassword@localhost:27017
      run: |
        pytest backend/tests/ \
          --cov=backend/newsradar_api \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term \
          --cov-fail-under=50

    # -------------------------
    # DOCUMENTATION GENERATION
    # -------------------------
    - name: Generate API docs (pdoc)
      run: |
        pip install pdoc
        PYTHONPATH=backend bash scripts/docs.sh

    # -------------------------
    # DOCKER BUILD & TAGGING
    # -------------------------
    - name: Build Docker images with Tagging
      run: |
        SHA_SHORT=$(git rev-parse --short HEAD)
        echo "Generando imágenes con tag: ${SHA_SHORT}"
        docker build -t newsradar-backend:${SHA_SHORT} -t newsradar-backend:latest ./backend
        docker images

    # -------------------------
    # Upload coverage artifacts
    # -------------------------
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/

    # -------------------------
    # Upload API docs
    # -------------------------
    - name: Upload API docs
      uses: actions/upload-artifact@v4
      with:
        name: api-docs
        path: docs/api/

    # -------------------------
    # CLEANUP
    # -------------------------
    - name: Cleanup
      if: always()
      run: docker compose -f docker-compose.yml down || true