name: CI Complete Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:

    # -------------------------
    # Checkout
    # -------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------
    # Setup Python
    # -------------------------
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # -------------------------
    # Install dependencies
    # -------------------------
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest pytest-cov

    # -------------------------
    # LINT
    # -------------------------
    - name: Lint code
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # -------------------------
    # TESTS + COVERAGE 🔥 (Actualizado)
    # -------------------------
    - name: Run tests with coverage
      # Usamos --cov=backend para medir solo tu código y --cov-fail-under para asegurar el aprobado
      run: |
        pytest backend/ \
          --cov=backend \
          --cov-report=xml \
          --cov-report=html \
          --cov-fail-under=70

    # -------------------------
    # Upload coverage artifacts (Actualizado)
    # -------------------------
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        # Guardamos tanto el XML para Sonar como la carpeta HTML para el equipo
        path: |
          coverage.xml
          htmlcov/

    # -------------------------
    # SONARCLOUD 🔥
    # -------------------------
    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # -------------------------
    # DOCKER BUILD
    # -------------------------
    - name: Build Docker images
      run: docker compose build

    # -------------------------
    # INTEGRATION TESTS
    # -------------------------
    - name: Run integration environment
      run: |
        docker compose -f docker-compose.test.yml up \
          --build \
          --abort-on-container-exit

    # -------------------------
    # CLEANUP
    # -------------------------
    - name: Cleanup
      run: docker compose down