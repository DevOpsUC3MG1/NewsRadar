version: "3.9"
services:
  db_postgres:
    image: postgres:15-alpine
    container_name: newsradar_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_mongodb:
    image: mongo:7.0
    container_name: newsradar_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend: Se encarga de la lógica y conexión a BD
  api:
    build: ./backend
    container_name: newsradar_api
    depends_on:
      db_postgres:
        condition: service_healthy
      db_mongodb:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MONGODB_URL=${MONGODB_URL}
      - IA_PROVIDER=${IA_PROVIDER}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=${GROQ_BASE_URL}
      - GROQ_MODEL=${GROQ_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    command: >
      sh -c "export PYTHONPATH=/app/newsradar_api &&
      python /app/newsradar_api/init_db.py &&
      python -m app.seed &&
      uvicorn newsradar_api.app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=2).status==200 else sys.exit(1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Frontend: La interfaz de usuario
  frontend:
    build: ./frontend
    container_name: newsradar_frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

  # Demonio de notificaciones RSS
  notification_daemon:
    build: ./services/notification_daemon
    container_name: newsradar_notification_daemon
    env_file: ./services/notification_daemon/.env
    environment:
      - API_BASE_URL=http://api:8000
      - RSS_SOURCES_PATH=/data/rss_sources.json
    volumes:
      - ./data:/data:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  
  mock_rss:
    build: ./services/mock_rss
    container_name: newsradar_mock_rss
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
