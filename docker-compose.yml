version: "3.9"

services:
  db_postgres:
    image: postgres:15-alpine
    container_name: newsradar_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_mongodb:
    image: mongo:7.0
    container_name: newsradar_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # Backend: Se encarga de la lógica y conexión a BD
  api:
    build: ./backend
    container_name: newsradar_api
    depends_on:
      db_postgres:
        condition: service_healthy
      db_mongodb:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MONGODB_URL=${MONGODB_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    command: >
      sh -c "export PYTHONPATH=/app/newsradar_api &&
      python /app/newsradar_api/init_db.py &&
      python -m app.seed &&
      uvicorn newsradar_api.app.main:app --host 0.0.0.0 --port 8000"

  # Frontend: La interfaz de usuario
  frontend:
    build: ./frontend
    container_name: newsradar_frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  mongodb_data: