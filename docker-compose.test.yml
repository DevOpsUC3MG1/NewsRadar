version: '3.8'
services:
  db_test:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_pass
      - POSTGRES_DB=newsradar_test
    ports:
      - "5433:5432" # Usamos el puerto 5433 para no chocar con la BD normal

  backend:
    build: ./backend
    environment:
      - DATABASE_URL=postgresql://test_user:test_pass@db_test:5432/newsradar_test
      - ENV=testing
    depends_on:
      - db_test